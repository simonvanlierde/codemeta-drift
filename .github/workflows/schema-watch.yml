name: Schema watcher
on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'
permissions:
  contents: read
concurrency:
  group: schema-watcher
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run pytest -m live tests/test_poll.py
      - name: Poll and prepare drafts
        run: uv run python -m codemeta_drift.poll --out schema-watch.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: schema-watch
          path: schema-watch.json
      - name: Publish missing issues when configured
        env:
          GH_TOKEN: ${{ secrets.MAPPING_WATCH_TOKEN }}
        run: |-
          if [ -n "$GH_TOKEN" ]; then
            uv run python -m codemeta_drift.poll --out schema-watch.json --publish
          fi
