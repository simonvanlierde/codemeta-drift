name: pages

# The crosswalk page: site/ with the example mapping export beside it. A pull request that
# touches it runs the page's tests; a release tag (or a manual run) also deploys it to GitHub Pages.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "site/**"
      - "examples/mapping-*.json"
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a deploy halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner's Node is enough: the tests have no dependencies.
      - run: node --test site/*.test.mjs
      - name: Assemble the page
        run: |
          mkdir _site
          cp site/index.html site/style.css site/main.mjs site/crosswalk.mjs examples/mapping-3.1.json _site/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # to deploy to GitHub Pages
      id-token: write # to verify the deployment's origin
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deploy
