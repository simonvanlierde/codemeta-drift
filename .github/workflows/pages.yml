name: pages

# The coverage page (site/). A pull request builds it; a push to main and the Monday run deploy it to
# GitHub Pages. Each build compares CodeMeta's main branch as it is that day, so the weekly run keeps
# the upstream section current without a commit.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a deploy halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
          python-version: "3.14"
      - run: uv sync --locked
      # The runner's own Node: the test imports a plain module and needs no packages.
      - run: node --test site/fragment.test.mjs
      # Read only through git, never run: the build reads CodeMeta's files as data, at main and at the
      # export's tag, so the clone is full (about 11 MB).
      - run: git clone --no-checkout https://github.com/codemeta/codemeta.git "${RUNNER_TEMP}/codemeta"
      - run: uv run site/build.py --out _site --codemeta "${RUNNER_TEMP}/codemeta"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # to deploy to GitHub Pages
      id-token: write # to verify the deployment's origin
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deploy
