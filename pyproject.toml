[project]
name = "codemeta-drift"
version = "0.9.0"
description = "Show where CodeMeta's crosswalk cells work as written and where they don't, check CodeMeta consistency, export JSON crosswalk mappings and SSSOM, and preview schema drift for review"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Simon van Lierde", email = "code@duinlab.nl" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []
keywords = [ # citesync compares this list to keywords in CITATION.cff
  "CodeMeta",
  "software metadata",
  "crosswalk",
  "crosswalk coverage",
  "JSON-LD",
  "SSSOM",
  "schema drift",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.scripts]
codemeta-drift = "codemeta_drift.cli:entry"

[project.urls]
Homepage = "https://github.com/simonvanlierde/codemeta-drift"
Documentation = "https://simonvanlierde.com/codemeta-drift/docs/"
Source = "https://github.com/simonvanlierde/codemeta-drift"
Issues = "https://github.com/simonvanlierde/codemeta-drift/issues"
DOI = "https://doi.org/10.5281/zenodo.23774728"
Changelog = "https://github.com/simonvanlierde/codemeta-drift/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "jsonschema>=4.26.0",
  "mutmut==3.8.1",
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
  "pyyaml>=6.0.3",
  "ruff>=0.17.3",
  "ty>=0.0.93",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.14.0"]
build-backend = "uv_build"

# Resolve only releases at least a week old: a compromised release is usually
# caught and yanked within that window. The dependency bot waits the same week, bar
# the author's own packages.
# Set here, not user-wide, so every machine writes the same uv.lock.
[tool.uv]
exclude-newer = "1 week"

# uv_build derives the package dir from the normalized project.name, so pin it
# for a module_name that differs.
[tool.uv.build-backend]
module-name = "codemeta_drift"

# NOTE: self-contained ruff config, deliberately not extended from any shared base.
# No target-version: ruff derives it from requires-python above.
[tool.ruff]
line-length = 120

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN204", # missing-return-type-special-method
  "COM812", # trailing-comma-missing: conflicts with the formatter
  "CPY001", # missing copyright notice
  "D105",   # undocumented-magic-method
  "D107",   # undocumented-public-init
  "TD002",  # missing-todo-author: a plain `# TODO:` is enough
  "TD003",  # missing-todo-link
]

# Tests assert, use literal expectations, and need no docstrings, return
# annotations, or package __init__.py.
[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "D1", "INP001", "PLR2004", "ANN201", "S603", "S607"]
# The CLI prints its report and runs git with an argument list (no shell); the ref
# goes after --end-of-options.
"src/codemeta_drift/cli.py" = ["T201", "S603", "S607"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
# File names, JSON-LD keywords and rule codes are the domain, not magic values.
allow-magic-value-types = ["int", "str"]
max-args = 10

# A rule set to "warn" reports without failing: ty otherwise exits 1 on warnings too.
[tool.ty.terminal]
error-on-warning = false

# pytest 9's native table. strict turns unknown config keys, unknown markers and
# an xfail test that passes into errors, and filterwarnings turns warnings into
# failures, so a deprecation shows up in CI, not after the upgrade that removes it.
[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "--import-mode=importlib", "-m", "not live"]
markers = ["live: read-only contract checks against public schema sources"]
testpaths = ["tests"]
strict = true
filterwarnings = ["error"]
log_level = "INFO"

# Coverage is opt-in via `pytest --cov` (`just py-cov`), not addopts, because it
# slows every plain test run. No fail_under until there is a suite worth setting
# one against.
[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

# Checks from Scientific Python's repo-review (the sp-repo-review git hook) that this
# project skips on purpose. `prek run sp-repo-review --all-files` runs the rest.
[tool.repo-review.ignore]
PY007 = "just is the task runner: `just check` runs what CI runs"
PC110 = "ruff format runs as a local hook from the venv, the same ruff CI runs"
PC140 = "ty runs as a local hook from the venv"
PC170 = "no reStructuredText: rumdl checks the Markdown docs"
PC190 = "ruff check runs as a local hook from the venv"
PC901 = "the hooks run in CI's checks workflow, not on pre-commit.ci"
PC902 = "the hooks run in CI's checks workflow, not on pre-commit.ci"
PC903 = "the hooks run in CI's checks workflow, not on pre-commit.ci"
GH212 = "dependabot.yml groups the actions with the hook revs under multi-ecosystem-groups, which this check does not read"

# `just mutation` grades the whole test suite against checks.py and the export modules.
# cli.py is left out: most of its mutants change help text.
[tool.mutmut]
source_paths = ["src/codemeta_drift"]
only_mutate = ["src/codemeta_drift/checks.py", "src/codemeta_drift/export.py", "src/codemeta_drift/conformance.py", "src/codemeta_drift/paths.py"]
pytest_add_cli_args_test_selection = ["tests"]
also_copy = ["README.md", "docs", "examples", "site", ".github"]
