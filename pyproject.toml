[project]
name = "codemeta-drift"
version = "0.6.0"
description = "Show where CodeMeta's crosswalks are wrong or missing, check CodeMeta consistency, export JSON crosswalk mappings and SSSOM, and preview schema drift for review"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Simon van Lierde", email = "code@duinlab.nl" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
codemeta-drift = "codemeta_drift.cli:main"

[project.urls]
Homepage = "https://github.com/simonvanlierde/codemeta-drift"
Issues = "https://github.com/simonvanlierde/codemeta-drift/issues"

[dependency-groups]
dev = [
  "jsonschema>=4.26.0",
  "mutmut==3.8.0",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pyyaml>=6.0.3",
  "ruff>=0.17.1",
  "ty>=0.0.89",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.14.0"]
build-backend = "uv_build"

# Resolve only releases at least a week old: a compromised release is usually
# caught and yanked within that window. The dependency bot waits the same week.
# Set here, not user-wide, so every machine writes the same uv.lock.
[tool.uv]
exclude-newer = "1 week"

# uv_build derives the package dir from the normalized project.name, so pin it
# for a module_name that differs.
[tool.uv.build-backend]
module-name = "codemeta_drift"

# NOTE: self-contained ruff config, deliberately not extended from any shared base.
# No target-version: ruff derives it from requires-python above.
[tool.ruff]
line-length = 120

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN204", # missing-return-type-special-method
  "COM812", # trailing-comma-missing: conflicts with the formatter
  "CPY001", # missing copyright notice
  "D105",   # undocumented-magic-method
  "D107",   # undocumented-public-init
  "TD002",  # missing-todo-author: a plain `# TODO:` is enough
  "TD003",  # missing-todo-link
]

# Tests assert, use literal expectations, and need no docstrings, return
# annotations, or package __init__.py.
[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "D1", "INP001", "PLR2004", "ANN201", "S603", "S607"]
# The CLI prints its report and runs git with an argument list (no shell); the ref
# goes after --end-of-options.
"src/codemeta_drift/cli.py" = ["T201", "S603", "S607"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
# File names, JSON-LD keywords and rule codes are the domain, not magic values.
allow-magic-value-types = ["int", "str"]
max-args = 10

# A rule set to "warn" reports without failing: ty otherwise exits 1 on warnings too.
[tool.ty.terminal]
error-on-warning = false

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers", "--import-mode=importlib", "-m", "not live"]
markers = ["live: read-only contract checks against public schema sources"]
testpaths = ["tests"]

# Coverage is opt-in via `pytest --cov` (`just py-cov`), not addopts, because it
# slows every plain test run. No fail_under until there is a suite worth setting
# one against.
[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

# `just mutation` grades the whole test suite against checks.py and the export modules.
# cli.py is left out: most of its mutants change help text.
[tool.mutmut]
source_paths = ["src/codemeta_drift"]
only_mutate = ["src/codemeta_drift/checks.py", "src/codemeta_drift/export.py", "src/codemeta_drift/conformance.py", "src/codemeta_drift/paths.py"]
pytest_add_cli_args_test_selection = ["tests"]
also_copy = ["docs", "examples", "site"]
