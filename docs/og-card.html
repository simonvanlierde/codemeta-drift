<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>codemeta-drift social card</title>
<!-- Source of site/og.png. Render: see README.md, "Social card". -->
<style>
  @font-face { font-family: Newsreader; src: url("../site/fonts/newsreader-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "JetBrains Mono"; src: url("../site/fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "JetBrains Mono"; src: url("../site/fonts/jetbrains-mono-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
  :root {
    --paper: #fbf9f6; --ink: #211f24; --faint: #5c5a60; --mark: #b3261e; --link: #2f4b7c; --asis: #e8e4de;
    --serif: Newsreader, Charter, "Bitstream Charter", Cambria, Georgia, serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--paper); color: var(--ink); }
  /* The coverage matrix at full size: 19 CodeMeta terms across, 10 formats down, one cell each. */
  #m { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(19, 1fr); grid-template-rows: repeat(10, 1fr); }
  /* Glyphs are about 45% of the cell and one step off the cell's own tone: texture up close, gone at thumbnail size. */
  .c { margin: 13px; display: grid; place-items: center; font: 400 17px/1 var(--serif); }
  .o { background: var(--asis); color: #c9c3ba; }
  .x { background: var(--mark); color: var(--paper); opacity: 1; }
  .p { border: 2px solid var(--mark); color: #b3261e66; }
  .n { visibility: hidden; }
  /* A quiet field under the text; the matrix shows through it. Everything that carries meaning sits in the centred 630 px column. */
  main { position: absolute; z-index: 1; isolation: isolate; left: 285px; top: 0; width: 630px; height: 630px; }
  main::before { content: ""; position: absolute; inset: 0 -170px; z-index: -1;
    background: linear-gradient(90deg, #fbf9f600, #fbf9f6f0 170px calc(100% - 170px), #fbf9f600); }
  h1 { position: absolute; top: 58px; font: 700 70px/1 var(--mono); letter-spacing: -0.04em; }
  .job { position: absolute; top: 190px; font: 400 40px/1.2 var(--serif); width: 600px; }
  .url { position: absolute; bottom: 52px; font: 400 32px/1 var(--mono); color: var(--faint); letter-spacing: -0.03em; }
  .url::before { content: ""; display: block; width: 96px; border-top: 2px dashed var(--link); margin-bottom: 26px; }
</style>
</head>
<body>
<!-- Cells are CodeMeta 4.0's crosswalk status for CFF, Zenodo, DataCite, BibTeX, pyproject.toml, PKG-INFO, Cargo, npm,
     R DESCRIPTION and Julia (rows) by the 19 terms of the page's matrix, from codemeta_drift.coverage on
     examples/mapping-4.0.json. o = works as written, x = wrong, p = missing, - = no field. -->
<div id="m"></div>
<main>
  <h1>codemeta-drift</h1>
  <p class="job">Where CodeMeta's crosswalks are wrong or missing.</p>
  <p class="url">simonvanlierde.com/codemeta-drift</p>
</main>
<script>
  const rows = ["ooooox----xxxoooo--", "oooppxpppxoxxxooo--", "xooooxxooxxxxpxxxx-", "opopp-----oxxxopxo-", "ppppp-----p--ppp---",
    "ooxpp-----x--pxo---", "xoopp-x---o--opx---", "ooopp-xpp-oxxooo---", "xoxxxpxxxpoxxoo-o--", "oppppp-----xx------"];
  const mark = { o: "✓", x: "✎", p: "+", "-": "" };
  document.getElementById("m").innerHTML = rows.join("").split("").map((s) => `<div class="c ${s === "-" ? "n" : s}">${mark[s]}</div>`).join("");
</script>
</body>
</html>
